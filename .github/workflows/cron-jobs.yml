name: Scheduled Cron Jobs

on:
  schedule:
    # Se ejecuta a las 3 AM Chile (7 AM UTC) todos los días
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  APP_URL: ${{ secrets.APP_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

jobs:
  recalculate-balances:
    name: Recalcular Balances de Clientes
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuración
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret no está configurado"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret no está configurado"
            exit 1
          fi
          echo "✅ Configuración verificada"

      - name: Ejecutar recalculate-balances
        run: |
          echo "🔄 Llamando a $APP_URL/api/cron/recalculate-balances"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/cron/recalculate-balances" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📊 Response (HTTP $HTTP_CODE):"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::API respondió con código $HTTP_CODE"
            exit 1
          fi

          echo "✅ Balances recalculados exitosamente"
